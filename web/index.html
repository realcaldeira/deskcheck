  --ink:#0f172a; --muted:#475569; --faint:#64748b;
  --line:rgba(15,23,42,.08); --line-strong:rgba(15,23,42,.15);
  --primary:#2563eb; --primary-2:#4f46e5; --primary-soft:#eff6ff; --link:#1d4ed8; --on-primary:#ffffff;
  --ok:#15803d; --ok-soft:#dcfce7; --warn:#b45309; --warn-soft:#fef3c7; --bad:#be123c; --bad-soft:#ffe4e6; --idle:#475569; --idle-soft:#e2e8f0;

}

  --surface:#0f1626; --surface-glass:rgba(11,17,30,.78); --surface-2:#162036; --surface-3:#1f2c48;

  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 8px 24px -10px rgba(0,0,0,.55);

  --grad:linear-gradient(135deg,#3b82f6 0%,#6366f1 55%,#8b5cf6 100%); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090d16; --bg-glow:radial-gradient(960px 440px at 14% -10%,rgba(59,130,246,.22),transparent 65%),radial-gradient(800px 420px at 88% -12%,rgba(124,58,237,.2),transparent 65%);
  --surface:#0f1626; --surface-glass:rgba(11,17,30,.78); --surface-2:#162036; --surface-3:#1f2c48;
  --ink:#f1f5f9; --muted:#94a3b8; --faint:#64748b;
  --line:rgba(148,163,184,.14); --line-strong:rgba(148,163,184,.26);
  --primary:#60a5fa; --primary-2:#818cf8; --primary-soft:rgba(59,130,246,.16); --link:#93c5fd; --on-primary:#09111f;
  --ok:#4ade80; --ok-soft:rgba(34,197,94,.16); --warn:#fbbf24; --warn-soft:rgba(245,158,11,.16); --bad:#fb7185; --bad-soft:rgba(244,63,94,.16); --idle:#94a3b8; --idle-soft:rgba(148,163,184,.14);

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background-color:var(--bg);background-image:var(--bg-glow);background-attachment:fixed;color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;margin:0;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
h1,h2,h3,p{margin:0}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.inner{max-width:1320px;margin:0 auto;padding-inline:20px}
@media (max-width:600px){.inner{padding-inline:14px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--faint);background:var(--surface)}

.topbar{position:sticky;top:0;z-index:35;background:var(--surface-glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar .inner{min-height:60px;padding-block:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:36px;height:36px;border-radius:11px;background:var(--grad);display:grid;place-items:center;flex:none;box-shadow:0 8px 20px -6px color-mix(in srgb,var(--primary) 65%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.logo svg{width:19px;height:19px;stroke:#fff}
.brand-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.brand-txt h1{font-size:16.5px;font-weight:800;letter-spacing:-.025em;line-height:1.2}
.brand-txt p{font-size:12px;color:var(--muted);line-height:1.3;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ro{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--ok-soft);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 25%,transparent);white-space:nowrap}
.ro.sim{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.tools{display:flex;gap:6px;align-items:center}
.langs{display:inline-flex;align-items:center;gap:2px;padding:3px 3px 3px 9px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.langs button{border:0;background:transparent;color:var(--muted);font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:7px;transition:all .15s}
.langs button:hover{color:var(--ink)}
.langs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.12)}
.iconbtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--muted);transition:all .15s}
.iconbtn:hover{border-color:var(--line-strong);color:var(--ink);background:var(--surface-2);transform:translateY(-1px)}

.dock{padding-top:18px}
.entry{background:var(--surface);border-radius:18px;border:1px solid var(--line-strong);box-shadow:var(--shadow-lg);padding:12px;display:flex;flex-direction:column;gap:10px;position:relative}
.entry::before{content:"";position:absolute;inset:-1px;border-radius:18px;padding:1px;background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 35%,transparent),transparent 45%,color-mix(in srgb,var(--primary-2) 28%,transparent));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.entry .row{display:flex;gap:10px;align-items:center}
.field{flex:1;min-width:0;position:relative;display:flex;align-items:center}
.field svg{position:absolute;left:14px;color:var(--faint)}
.field input{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:12px 46px 12px 42px;font-size:14.5px;transition:all .18s}
.field input::placeholder{color:var(--faint)}
.field input:focus{outline:none;border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 4px var(--primary-soft)}
.field kbd{position:absolute;right:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);border-radius:11px;padding:9px 15px;font-weight:600;text-decoration:none;color:var(--ink);white-space:nowrap;transition:all .16s}
.btn:hover{background:var(--surface-2);border-color:var(--line-strong)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;padding:12px 22px;font-weight:700;letter-spacing:-.01em;box-shadow:0 10px 24px -8px color-mix(in srgb,var(--primary) 75%,transparent),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.primary:hover{filter:brightness(1.07);transform:translateY(-1px);box-shadow:0 14px 28px -8px color-mix(in srgb,var(--primary) 85%,transparent)}
.btn.primary[disabled]{opacity:.6;cursor:progress;transform:none}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:9px}
.btn.live{background:var(--grad);border-color:transparent;color:#fff;font-weight:700;box-shadow:0 8px 20px -6px color-mix(in srgb,var(--primary) 75%,transparent),inset 0 1px 0 rgba(255,255,255,.22)}
.btn.live:hover{filter:brightness(1.08);transform:translateY(-1px)}
.live-dot{width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.32);animation:pulse 1.2s infinite;flex:none}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{border-color:color-mix(in srgb,var(--bad) 35%,var(--line));color:var(--bad);background:transparent}
.btn.danger:hover{background:var(--bad-soft);border-color:var(--bad)}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger.solid:hover{filter:brightness(1.08)}
.entry-foot{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:2px 4px 0}
.agents{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.agents > span,.datamode > span{font-size:12px;font-weight:600;color:var(--faint);margin-right:2px}
.datamode{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.seg{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.seg button{border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600;padding:4px 11px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;transition:all .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.12)}
.seg button.real[aria-pressed="true"]{color:var(--ok)}
.seg button.mock[aria-pressed="true"]{color:var(--warn)}
.login-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);white-space:nowrap;transition:all .15s}
.login-btn:hover{border-color:var(--primary);background:var(--primary-soft);color:var(--link)}
.login-box{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.login-box .row{display:flex;gap:8px;align-items:center}
@media (max-width:600px){.login-box .row{flex-direction:column;align-items:stretch}}
.live-login{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--warn-soft);border-bottom:1px solid color-mix(in srgb,var(--warn) 35%,transparent);color:var(--warn);font-size:12.5px;font-weight:700}
.ag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 12px 4px 9px;font-size:12px;font-weight:600;color:var(--muted);transition:all .15s}
.ag:hover:not([disabled]){border-color:var(--line-strong);color:var(--ink);background:var(--surface)}
.ag[aria-pressed="true"]{border-color:color-mix(in srgb,var(--primary) 55%,transparent);background:var(--primary-soft);color:var(--link);box-shadow:0 0 0 1px color-mix(in srgb,var(--primary) 25%,transparent)}
.ag[disabled]{opacity:.45;cursor:help}
.ag i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.ag.on i{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.err{color:var(--bad);font-size:12.5px;font-weight:600;padding:2px 6px}
@media (max-width:900px){.topbar .brand-txt{flex:1 1 calc(100% - 54px)}.topbar .ro{order:3}.topbar .tools{order:4;margin-left:auto}}
@media (max-width:600px){.entry .row{flex-direction:column;align-items:stretch}.brand-txt p,.field kbd{display:none}}

.flowband{padding-top:14px}
.flowcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.flowcard-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.flowcard-txt{flex:1;min-width:220px;display:flex;flex-direction:column;gap:3px}
.flowcard-kicker{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--link)}
.flowcard-head h2{font-size:15px;font-weight:800;letter-spacing:-.015em;color:var(--ink)}
.flowcard-head p{font-size:12.5px;color:var(--muted);line-height:1.4}
.flow-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.flow-grid li{position:relative;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:12px;display:flex;flex-direction:column;gap:7px;transition:all .18s}
.flow-grid li::before{content:"";position:absolute;inset:0 0 auto 0;height:2.5px;border-radius:13px 13px 0 0;background:transparent}
.flow-grid li:hover{border-color:var(--line-strong);transform:translateY(-1px);box-shadow:var(--shadow)}
.flow-grid li.on{background:color-mix(in srgb,var(--ok-soft) 28%,var(--surface-2));border-color:color-mix(in srgb,var(--ok) 28%,var(--line))}
.flow-grid li.on::before{background:var(--ok)}
.flow-grid li.now{background:color-mix(in srgb,var(--primary-soft) 65%,var(--surface));border-color:color-mix(in srgb,var(--primary) 50%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--primary) 25%,transparent)}
.flow-grid li.now::before{background:var(--grad)}
.flow-top{display:flex;align-items:center;gap:7px}
.flow-num{flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-style:normal;font-size:11.5px;font-weight:800;background:var(--surface);border:1px solid var(--line-strong);color:var(--muted)}
.flow-grid li.on .flow-num{background:var(--ok);border-color:var(--ok);color:#fff}
.flow-grid li.now .flow-num{background:var(--grad);border-color:transparent;color:#fff}
.flow-ico{color:var(--faint);margin-left:auto}
.flow-grid li.on .flow-ico{color:var(--ok)}
.flow-grid li.now .flow-ico{color:var(--primary)}
.flow-grid b{display:block;font-size:12.5px;font-weight:700;line-height:1.3;color:var(--ink)}
.flow-grid span{display:block;font-size:11.5px;color:var(--muted);line-height:1.4}
.flow-trust{display:flex;flex-wrap:wrap;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.trust-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.trust-pill svg.i{width:13px;height:13px;color:var(--primary)}
.trust-pill.ok svg.i{color:var(--ok)}
.ribbon{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ribbon-list{list-style:none;margin:0;padding:0;display:flex;align-items:center;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.ribbon-list::-webkit-scrollbar{display:none}
.ribbon-list li{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--muted);padding:4px 10px 4px 6px;border-radius:999px;background:var(--surface-2);border:1px solid transparent;white-space:nowrap;transition:all .15s}
.ribbon-list li > i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10.5px;font-weight:800;background:var(--surface-3);color:var(--muted);flex:none}
.ribbon-list li.on{color:var(--ink);background:color-mix(in srgb,var(--ok-soft) 65%,var(--surface))}
.ribbon-list li.on > i{background:var(--ok);color:#fff}
.ribbon-list li.now{color:var(--link);background:var(--primary-soft);border-color:color-mix(in srgb,var(--primary) 40%,transparent)}
.ribbon-list li.now > i{background:var(--primary);color:var(--on-primary)}
.ribbon-acts{display:flex;gap:4px;margin-left:auto;flex:none;align-items:center}
@media (max-width:1120px){.flow-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:600px){.flowcard{padding:13px}.flow-grid{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:80%;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}.flow-grid li{scroll-snap-align:start}.ribbon{flex-direction:column;align-items:stretch;gap:8px;overflow:hidden}.ribbon-list{width:100%;max-width:100%}.ribbon-acts{justify-content:flex-end;margin-left:0}}

.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.flow li{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:flex-start}
.flow li > i{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11.5px;font-weight:800;background:var(--surface-3);color:var(--muted)}
.flow li.on > i{background:var(--ok);color:#fff}
.flow li.now > i{background:var(--primary);color:var(--on-primary)}
.flow li div{min-width:0}
.flow b{display:block;font-size:12.5px;line-height:1.3}
.flow span{display:block;font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:3px}
@media (max-width:760px){.flow{grid-template-columns:1fr}}
.linkbtn{border:0;background:none;color:var(--link);font-size:12px;font-weight:600;display:inline-flex;gap:4px;align-items:center;margin-left:auto;padding:0}

.modal{position:fixed;inset:0;z-index:55;background:rgba(6,8,14,.6);backdrop-filter:blur(6px);display:flex;justify-content:center;align-items:flex-start;padding:40px 16px;overflow:auto;animation:fade .18s}
.sheet{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:20px;box-shadow:var(--shadow-lg);max-width:800px;width:100%;padding:22px 24px;display:flex;flex-direction:column;gap:14px;animation:rise .22s}
.sheet header{display:flex;align-items:center;gap:10px}
.sheet h2{font-size:18px;font-weight:800;letter-spacing:-.02em;flex:1}
.sheet h3{font-size:13.5px;font-weight:700;margin-top:4px}
.sheet p{color:var(--muted);font-size:13.5px}
.sheet .lead{color:var(--ink)}
.sheet .flow{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:600px){.sheet{padding:16px}.sheet .flow{grid-template-columns:1fr}}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.legend li{display:grid;grid-template-columns:112px minmax(0,1fr);gap:10px;align-items:center}
.legend .st{justify-self:start}
.azure-en{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--link);background:var(--primary-soft);border:1px solid color-mix(in srgb,var(--primary) 24%,transparent);border-radius:999px;padding:4px 11px;margin-right:auto}

main.inner{padding-block:18px 64px;display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:960px){main.inner{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:12px;min-width:0;position:sticky;top:76px;max-height:calc(100vh - 92px)}
@media (max-width:960px){.side{position:static;max-height:none}}
.side-head{display:flex;align-items:center;gap:6px;padding-inline:2px}
.side-acts{margin-left:auto;display:inline-flex;align-items:center;gap:6px}

.qi:hover{border-color:var(--line-strong);transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.qi[aria-current="true"]{border-color:color-mix(in srgb,var(--primary) 65%,transparent);background:color-mix(in srgb,var(--primary-soft) 45%,var(--surface));box-shadow:0 0 0 1px color-mix(in srgb,var(--primary) 40%,transparent),var(--shadow)}

.track{list-style:none;margin:2px 0 0;padding:14px 10px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.track li{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;color:var(--faint);text-align:center;line-height:1.25;padding-inline:4px;cursor:pointer}
.track li::before{content:"";position:absolute;top:14px;right:50%;width:100%;height:3px;border-radius:2px;background:var(--surface-3)}
.track li:first-child::before{display:none}
.track li.on::before,.track li.now::before,.track li.gate::before,.track li.bad::before{background:linear-gradient(90deg,var(--ok),color-mix(in srgb,var(--ok) 80%,var(--primary)))}
.track i{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;background:var(--surface);border:2px solid var(--line-strong);display:grid;place-items:center;font-style:normal;font-size:11.5px;font-weight:800;color:var(--faint);transition:all .25s}
.track li:hover i{transform:scale(1.08)}
.track li.on i{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 4px 12px -4px color-mix(in srgb,var(--ok) 65%,transparent)}
.track li.now i{border-color:var(--primary);color:var(--primary);background:var(--surface);box-shadow:0 0 0 5px var(--primary-soft)}
.track li.now i::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid transparent;border-top-color:var(--primary);animation:spin 1s linear infinite}
.track li.gate i{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.track li.bad i{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.track li.on{color:var(--ink);font-weight:600} .track li.now{color:var(--link);font-weight:700} .track li.gate{color:var(--warn);font-weight:700} .track li.bad{color:var(--bad);font-weight:700}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.now-box{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;background:linear-gradient(135deg,var(--primary-soft),color-mix(in srgb,var(--primary-2) 10%,var(--surface)));border:1px solid color-mix(in srgb,var(--primary) 30%,transparent);border-radius:14px;padding:13px 15px;font-size:13px;animation:rise .25s}

@media (max-width:600px){.now-box .now-act{width:100%}}
.now-box.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)} .now-box.warn .dot{background:var(--warn);box-shadow:none;animation:none} .now-box.warn b{color:var(--warn)}
.now-box.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,transparent)} .now-box.bad .dot{background:var(--bad);box-shadow:none;animation:none} .now-box.bad b{color:var(--bad)}

.live-panel{border:1px solid color-mix(in srgb,var(--primary) 35%,var(--line));border-radius:15px;background:linear-gradient(180deg,color-mix(in srgb,var(--primary-soft) 55%,var(--surface)),var(--surface) 44%);overflow:hidden;box-shadow:var(--shadow);animation:rise .25s}

.gatebox{border:1px solid color-mix(in srgb,var(--warn) 50%,transparent);background:var(--warn-soft);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;animation:rise .25s}

.svgring{position:relative;width:72px;height:72px;flex:none;display:grid;place-items:center}

.stat:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--sc) 45%,var(--line));box-shadow:var(--shadow)}

.v-ok{--vc:var(--ok);--vs:var(--ok-soft)} .v-warn{--vc:var(--warn);--vs:var(--warn-soft)} .v-bad{--vc:var(--bad);--vs:var(--bad-soft)} .v-idle{--vc:var(--idle);--vs:var(--idle-soft)}

function makeT(lang) {
  const dict = STRINGS[lang] || STRINGS.pt;
  const t = (key, params) => String(dict[key] ?? STRINGS.pt[key] ?? key).replace(/\{(\w+)\}/g, (m, k) => (params && k in params ? params[k] : m));
  t.lang = lang;
  t.locale = dict.locale;
  t.tr = (text, run) => {
    const s = String(text || "");
    if (!s || lang !== "pt") return s;
    const trimmed = s.trim();
    return run?.pt?.[trimmed] || PT_TERMS[trimmed] || s;
  };
  t.logText = (l) => {
    if (lang === "en" && l.key && LOG_EN[l.key]) return LOG_EN[l.key](l.params || {});
    if (lang === "pt" && l.key === "card.read" && l.params) {
      const p = l.params;
      return `Card lido: ${PT_TERMS[p.type] || p.type}, ${PT_TERMS[p.state] || p.state}, responsável ${p.assignee}. ${p.tcs} Test Case(s) no Tested By, ${p.acs} critério(s) de aceite.`;
    }
    return l.text;
  };
  t.error = (r) => (lang === "en" && r.code && ERRORS_EN[r.code] ? ERRORS_EN[r.code](r.params || {}) : r.error);
  return t;
}

    lightbox >= 0 && shots[lightbox] && h(Lightbox, { shots, index: lightbox, setIndex: setLightbox, scenarioStatus, scenarios, run: r }));
}

function describeLiveEvent(l, t) {
  const txt = t.logText(l);
  if (l.key === "login.waiting" || /deskcheck(\.mjs)?\s+login\b/i.test(txt)) return { summary: t("live.actLogin"), detail: txt, isLogin: true };
  if (l.kind === "tool" || /^(Bash|Read|Write|Edit|Glob|Grep):/.test(txt)) {
    if (/^(Bash):/.test(txt)) {
      if (/(npm\s+(ci|install|i)\b|yarn(\s+install)?\b|pnpm\s+i)/i.test(txt)) return { summary: t("live.actInstall"), detail: txt };
      if (/deskcheck(\.mjs)?\s+run\b/i.test(txt)) return { summary: t("live.actRun"), detail: txt };
      if (/deskcheck(\.mjs)?\s+explore\b/i.test(txt)) return { summary: t("live.actExplore"), detail: txt };
      if (/deskcheck(\.mjs)?\s+verdict\b/i.test(txt)) return { summary: t("live.actVerdict"), detail: txt };
      if (/(rsbuild|vite|webpack|dev\b|localhost:)/i.test(txt)) return { summary: t("live.actServer"), detail: txt };
      if (/\bgit\s+/i.test(txt)) return { summary: t("live.actGit"), detail: txt };
      return { summary: t("live.actBash"), detail: txt };
    }
    if (/^Read:/.test(txt)) return { summary: t("live.actRead"), detail: txt };
    if (/^Write:/.test(txt)) return { summary: t("live.actWrite"), detail: txt };
    if (/^Edit:/.test(txt)) return { summary: t("live.actEdit"), detail: txt };
    if (/^(Glob|Grep):/.test(txt)) return { summary: t("live.actSearch"), detail: txt };
  }
  return { summary: txt, detail: "" };
}

function LiveMonitor({ r, stepKeys, currentStep, onFollow }) {
  const t = useI18n();
  const feedRef = useRef(null);
  const [autoScroll, setAutoScroll] = useState(true);
  const logs = r.log || [];
  const last = logs[logs.length - 1];
  const stepNum = Math.min(r.step + 1, Math.max(stepKeys.length, 1));
  const lastDesc = last ? describeLiveEvent(last, t) : null;
  const kindLabel = (k) => k === "tool" ? t("follow.kindTool") : k === "agent" ? t("follow.kindAgent") : t("follow.kindPhase");

  useEffect(() => {
    if (autoScroll && feedRef.current) feedRef.current.scrollTop = feedRef.current.scrollHeight;
  }, [logs.length, autoScroll]);

  return h("div", { className: "live-panel", "aria-live": "polite" },
    h("div", { className: "live-head" },
      h("span", { className: "live-badge" }, h("i"), t("live.title")),
      h("span", { className: "live-step" }, t("follow.stepOf", { n: stepNum, total: Math.max(stepKeys.length, 1) }) + " · " + t("step." + currentStep)),
      h("span", { className: "live-timer" }, duration(r.startedAt)),
      h("div", { className: "push" },
        h("button", { className: "toggle-pill", type: "button", "aria-pressed": String(autoScroll), onClick: () => setAutoScroll((v) => !v) }, t("follow.autoScroll")),
        h("button", { className: "btn sm", type: "button", onClick: onFollow }, t("live.expand"), Icon("arrow", 13)))),
    lastDesc?.isLogin && h("div", { className: "live-login", role: "alert" }, Icon("key", 15), h("span", null, t("live.loginBanner"))),
    lastDesc && h("div", { className: "live-now" },
      h("div", { className: "live-now-top" }, h("span", { className: "dot" }), h("span", null, lastDesc.summary)),
      lastDesc.detail && h("code", null, lastDesc.detail),
      h("small", null, t("detail.whatHappens") + " " + t("hint." + currentStep))),
    h("div", { className: "live-bar" }, h("i")),
    logs.length > 0 && h("ul", { className: "live-feed", ref: feedRef }, logs.map((l, idx) => {
      const desc = describeLiveEvent(l, t);
      const isLatest = idx === logs.length - 1;
      return h("li", { key: idx, className: "live-row " + (l.kind || "phase") + (isLatest ? " latest" : "") },
        h("time", null, l.time),
        h("span", { className: "ltags" },
          h("span", { className: "ltag k" }, kindLabel(l.kind)),
          l.step && h("span", { className: "ltag" }, t("step." + l.step))),
        h("div", { className: "lbody" },
          h("span", { className: "lsum " + (l.level || "") }, desc.summary),
          desc.detail && h("span", { className: "ldet" }, desc.detail)));
    })));
}

function inferLogStep(l, prevStep) {
  if (l.step) return l.step;
  const k = l.key || "";
  if (k.startsWith("card.")) return "card";
  if (k.startsWith("pr.")) return "pr";
  if (k === "worktree.ready" || k.startsWith("agent.") || k === "sim.install" || k === "sim.screen" || k === "sim.scenarios") return "screen";
  if (k === "sim.tc" || k.startsWith("code.")) return "scenarios";
  if (k === "verdict" || k === "nothingWritten") return "report";
  if (/deskcheck(\.mjs)? run\b/.test(l.text || "")) return "scenarios";
  return prevStep || "card";
}

function groupLogByStep(log, stepKeys) {
  const buckets = Object.fromEntries(stepKeys.map((k) => [k, []]));
  let cur = stepKeys[0] || "card";
  for (const l of log || []) {
    cur = inferLogStep(l, cur);
    if (!buckets[cur]) buckets[cur] = [];
    buckets[cur].push(l);
  }
  return buckets;
}

function FollowDrawer({ r, steps, agents, onClose, onJumpTab }) {
  const t = useI18n();
  const bodyRef = useRef(null);
  const [autoFollow, setAutoFollow] = useState(true);
  const [collapsed, setCollapsed] = useState({});
  const done = r.status === "done";
  const running = r.status === "running";
  const stepKeys = steps.length ? steps.map(([k]) => k) : ["card", "pr", "screen", "scenarios", "report"];
  const stepCount = stepKeys.length;
  const stepNum = done ? stepCount : Math.min(r.step + 1, stepCount);
  const pct = done ? 100 : Math.round((r.step / stepCount) * 100);
  const agent = agents.find((a) => a.id === r.agent);
  const grouped = useMemo(() => groupLogByStep(r.log, stepKeys), [r.log, stepKeys]);
  const res = r.result || {};
  const defectsCount = (res.defects || []).length;
  useTick(running);

  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    document.body.style.overflow = "hidden";
    return () => { window.removeEventListener("keydown", onKey); document.body.style.overflow = ""; };
  }, [onClose]);

  useEffect(() => {
    if (autoFollow && bodyRef.current) bodyRef.current.scrollTop = bodyRef.current.scrollHeight;
  }, [r.log.length, r.step, r.status, autoFollow]);

  const stateOf = (i) => {
    if (i < r.step || done) return "on";
    if (i > r.step) return "pend";
    return running ? "now" : r.status === "error" ? "bad" : "gate";
  };
  const pillOf = (st) => {
    if (st === "on") return ["done", t("follow.stepDone")];
    if (st === "now") return ["run", t("follow.stepNow")];
    if (st === "gate") return ["wait", t("follow.stepWait")];
    if (st === "bad") return ["bad", t("follow.stepErr")];
    return ["", t("follow.stepPend")];
  };
  const kindLabel = (k) => k === "tool" ? t("follow.kindTool") : k === "agent" ? t("follow.kindAgent") : t("follow.kindPhase");
  const toggleStep = (k) => setCollapsed((prev) => ({ ...prev, [k]: !prev[k] }));
  const barClass = done ? "done" : running ? "run" : r.status === "error" ? "bad" : "stop";

  return h("div", { className: "drawer-bg", role: "dialog", "aria-modal": "true", "aria-label": t("follow.title"), onClick: (e) => { if (e.target === e.currentTarget) onClose(); } },
    h("div", { className: "drawer" },
      h("header", { className: "drawer-head" },
        h("div", { className: "drawer-top" },
          h("h2", null, t("follow.title")),
          running && h("span", { className: "pill run" }, t("follow.live")),
          !running && h("span", { className: "pill " + (done ? verdictKind(res.verdict)[2] : PILL_CLASS[r.status]) }, done ? t("verdict." + (res.verdict || "incomplete")) : t("pill." + r.status)),
          h("button", { className: "btn sm ghost", type: "button", onClick: onClose, autoFocus: true }, Icon("x", 14), t("help.close"))),
        h("div", { className: "drawer-sub" },
          h("b", null, (r.type ? t.tr(r.type, r) : "Card") + " " + r.id),
          h("span", null, "· " + t.tr(r.title, r)),
          agent && h("span", null, "· " + agent.name),
          h("span", null, "· " + (r.dataMode === "mock" ? t("data.mock") : t("data.real"))),
          r.startedAt && h("span", null, "· " + (done || r.finishedAt ? t("detail.took", { d: duration(r.startedAt, r.finishedAt) }) : t("detail.runningFor", { d: duration(r.startedAt) })))),
        h("div", { className: "drawer-prog" },
          h("b", null, t("follow.stepOf", { n: stepNum, total: stepCount })),
          h("span", { className: "bar " + barClass }, h("i", { style: { width: Math.max(pct, 8) + "%" } })),
          h("button", { className: "toggle-pill", type: "button", "aria-pressed": String(autoFollow), onClick: () => setAutoFollow((v) => !v) }, t("follow.autoScroll")))),

      h("div", { className: "drawer-body", ref: bodyRef },
        r.status === "waiting" && r.prs && h("div", { className: "gatebox", role: "alert" },
          h("h3", null, t("gate.title")),
          h("p", null, t("gate.text")),
          h("div", { className: "prs" }, r.prs.map((p) => h("button", { key: p.repo + p.number, type: "button", className: "prbtn", onClick: () => post("/api/runs/" + r.key + "/choose", { number: p.number, repo: p.repo }) },
            h("b", null, "#" + p.number + " · " + p.title), h("span", null, shortRepo(p.repo) + " · " + p.branch + " · " + p.author + " · " + (p.state === "MERGED" ? t("pr.merged") : p.draft ? t("pr.draft") : t("pr.open"))))))),

        h("ol", { className: "tlist" }, stepKeys.map((k, i) => {
          const st = stateOf(i);
          const evs = grouped[k] || [];
          const [pCls, pTxt] = pillOf(st);
          const timing = r.stepTimes?.[k];
          const elapsed = timing?.startedAt ? duration(timing.startedAt, timing.finishedAt || (st === "now" ? null : r.finishedAt)) : "";
          const isOpen = collapsed[k] !== undefined ? !collapsed[k] : (st !== "pend" && (evs.length > 0 || st === "now" || st === "gate" || st === "bad"));
          return h("li", { key: k, className: "tstep " + (st === "pend" ? "" : st) },
            h("button", { type: "button", className: "tstep-btn", "aria-expanded": String(isOpen), onClick: () => toggleStep(k) },
              h("i", { className: "tstep-ico" }, st === "on" ? Icon("check", 14) : i + 1),
              h("div", { className: "tstep-main" },
                h("div", { className: "tstep-row" },
                  h("b", null, t("step." + k)),
                  pCls ? h("span", { className: "pill " + pCls }, pTxt) : h("span", { className: "tstep-meta" }, pTxt),
                  h("span", { className: "tstep-meta" },
                    evs.length > 0 && (evs.length === 1 ? t("follow.eventsOne") : t("follow.eventsMany", { n: evs.length })),
                    elapsed && (" · " + elapsed))),
                h("span", { className: "tstep-hint" }, t("hint." + k)))),
            isOpen && h("div", { className: "tstep-body" },
              evs.length > 0
                ? h("ul", { className: "tevents" }, evs.map((l, idx) => h("li", { key: idx, className: "tevent " + (l.kind || "phase") },
                    h("time", null, l.time),
                    h("span", { className: "ekind" }, kindLabel(l.kind)),
                    h("span", { className: "etxt " + (l.level || "") }, t.logText(l)))))
                : h("p", { className: "tstep-empty" }, st === "pend" ? t("follow.waitingStep") : t("follow.noEvents"))));
        }))),

      h("footer", { className: "drawer-foot" },
        h("span", { className: "safe" }, Icon("shield", 14), t("badge.readonly")),
        h("div", { className: "push" },
          done && h("button", { className: "btn sm", type: "button", onClick: () => onJumpTab("summary") }, t("follow.viewSummary")),
          done && defectsCount > 0 && h("button", { className: "btn sm", type: "button", onClick: () => onJumpTab("defects") }, t("follow.viewDefects") + " (" + defectsCount + ")"),
          done && h("a", { className: "btn sm", href: "/report/" + r.id + "/report.html", target: "_blank", rel: "noopener" }, Icon("ext", 13), t("verdict.fullReport"))))));
}

function LogList({ log, live }) {
  const t = useI18n();
  const ref = useRef(null);
  useEffect(() => { if (live && ref.current) ref.current.scrollTop = ref.current.scrollHeight; }, [log.length, live]);
  return h("ul", { className: "log", ref }, log.map((l, i) => h("li", { key: i }, h("time", null, l.time), h("span", { className: l.level }, t.logText(l)))));
}

function Lightbox({ shots, index, setIndex, scenarioStatus, scenarios, run }) {
  const t = useI18n();
  const s = shots[index];
  const scenario = scenarios.find((x) => x.id === s.scenario);
  const move = (d) => setIndex((x) => (x + d + shots.length) % shots.length);
  useEffect(() => {
    const k = (e) => {
      if (e.key === "Escape") setIndex(-1);
      if (e.key === "ArrowRight") move(1);
      if (e.key === "ArrowLeft") move(-1);
    };
    window.addEventListener("keydown", k);
    document.body.style.overflow = "hidden";
    return () => { window.removeEventListener("keydown", k); document.body.style.overflow = ""; };
  }, [shots.length, setIndex]);
  const status = scenarioStatus[s.scenario];
  return h("div", { className: "lightbox", role: "dialog", "aria-modal": "true", "aria-label": s.name, onClick: (e) => { if (e.target === e.currentTarget) setIndex(-1); } },
    h("button", { className: "iconbtn lb-close", type: "button", onClick: () => setIndex(-1), "aria-label": t("lb.close"), autoFocus: true }, Icon("x")),
    shots.length > 1 && h("button", { className: "lb-nav prev", type: "button", onClick: () => move(-1), "aria-label": t("lb.prev") }, Icon("left", 20)),
    h("img", { src: s.full, alt: s.name }),
    shots.length > 1 && h("button", { className: "lb-nav next", type: "button", onClick: () => move(1), "aria-label": t("lb.next") }, Icon("right", 20)),
    h("p", null, h("b", null, s.scenario + (status ? " · " + t("status." + status) : "") + " · " + (index + 1) + "/" + shots.length), " — ", scenario ? t.tr(scenario.notes, run) : s.name, " ", h("a", { href: s.full, target: "_blank", rel: "noopener" }, t("lb.original"))),
    h(MarkList, { marks: s.marks, run }));
}

ReactDOM.createRoot(document.getElementById("app")).render(h(App));
</script>
